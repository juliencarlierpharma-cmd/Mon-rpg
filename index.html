<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c24">
  <title>Les Échos Élémentaires</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" class="hide"></div>
  <div id="battle-ui"></div>
  <div id="touch">
    <div class="dpad">
      <button data-d="up" class="d-up" aria-label="Haut">▲</button>
      <button data-d="left" class="d-left" aria-label="Gauche">◀</button>
      <button data-d="right" class="d-right" aria-label="Droite">▶</button>
      <button data-d="down" class="d-down" aria-label="Bas">▼</button>
    </div>
    <div class="abtns">
      <button data-k="b" class="kb" aria-label="Menu">B</button>
      <button data-k="a" class="ka" aria-label="Action">A</button>
    </div>
  </div>
  <div id="title"></div>
  <div id="layer"></div>
  <div id="toasts"></div>

  <script src="js/core.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/world.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
